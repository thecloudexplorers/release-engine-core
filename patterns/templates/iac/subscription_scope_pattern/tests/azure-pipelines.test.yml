name: $(Build.DefinitionName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - users/*
  # paths:
  #   include:
  #     - patterns/templates/iac/subscription_scope_pattern/**

pool: MSHosted-WorkloadsPool

extends:
  template: /patterns/templates/iac/subscription_scope_pattern/deployment-pattern.yml
  parameters:
    deploymentSettings:
      configurationFilePath: /patterns/templates/iac/subscription_scope_pattern/tests/_config
      # Indicates if this is a test pipeline
      # Must be set to test release-engine functionalities or patterns
      isTestPipeline: true

      environments:
        - name: development
          dependsOn: build
          displayName: Dev
          afterBuild: true
        - name: test
          dependsOn: development
          displayName: Test
        - name: production
          dependsOn: test
          displayName: Prod
