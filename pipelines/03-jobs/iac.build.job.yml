parameters:
  - name: deploymentSettings
    type: object
  - name: patternSettings
    type: object

jobs:
  - job: ${{ variables.deploymentPattern }}_build
    displayName: Building IaC Artifacts
    variables:
      - template: ${{ parameters.deploymentSettings.configurationFilePath }}/metadata.yml@self
    steps:

      # Test Pipelines - Configuration file is in the same repository as the pattern
      - ${{ if eq(parameters.deploymentSettings.isTestPipeline, 'true') }}: # 1

          # Scenario 1: Pattern is in its own repository (external pattern)
          - ${{ if eq(parameters.patternSettings.isExternalPattern, 'true') }}: 
              - powershell: |
                  Write-Host "Test Pipeline: External Pattern - #1"
                displayName: 'Test Pipeline: External Pattern - #1'

              - checkout: self # pattern repository
                path: s/checkoutDirectory
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.jsonc
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
                  **/common/scripts/**

              # Checkout release-engine-core         
              - checkout: release-engine-core
                path: s/checkoutDirectory/release-engine-core
                sparseCheckoutPatterns: |
                  **/common/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep

              # TODO: Move scripts to a PowerShell Module, so they are not required to be copied 
              # Copy common scripts from release-engine-core
              - task: CopyFiles@2
                displayName: Copying common scripts content (external)
                inputs:
                  SourceFolder: $(Pipeline.Workspace)/s/checkoutDirectory/release-engine-core/common/scripts
                  Contents: |
                    **/*.ps1
                    **/*.sh
                  TargetFolder: $(build.artifactstagingdirectory)/common/scripts
                  flattenFolders: false                

          # Scenario 2: Pattern is in release-engine-core repository (internal pattern)
          - ${{ if eq(parameters.patternSettings.isExternalPattern, 'false') }}: 
              - powershell: |
                  Write-Host "Test Pipeline: Internal Pattern - #2"
                displayName: 'Test Pipeline: Internal Pattern - #2'
              
              # release-engine-core repository
              - checkout: self 
                path: s/checkoutDirectory
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.jsonc
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
                  **/common/scripts/**                
      
              # TODO: Move scripts to a PowerShell Module, so they are not required to be copied 
              # Copy common scripts from release-engine-core
              - task: CopyFiles@2
                displayName: Copying common scripts content (internal)
                inputs:
                  SourceFolder: $(Pipeline.Workspace)/s/checkoutDirectory/common/scripts
                  Contents: |
                    **/*.ps1
                    **/*.sh
                  TargetFolder: $(build.artifactstagingdirectory)/common/scripts
                  flattenFolders: false
                      
      # Production pipelines - Configuration file is on its own repository
      - ${{ if eq(parameters.deploymentSettings.isTestPipeline, 'false') }}:

          # Scenario 3: Production pipeline consuming a pattern from dedicated pattern repository (external pattern)
          - ${{ if eq(parameters.patternSettings.isExternalPattern, 'true') }}: 
              - powershell: |
                  Write-Host "Deployment Pipeline: Dedicated Pattern repository"
                displayName: 'Deployment Pipeline: Dedicated Pattern repository'

              # Checkout configuration files from self (configuration repository)
              - checkout: self # configuration repository
                path: s/checkoutDirectory/configuration
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.jsonc
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**

              # Checkout pattern from dedicated pattern repository
              - checkout: pattern # pattern repository
                path: s/checkoutDirectory/pattern
                sparseCheckoutPatterns: |
                  **/*.bicep
                  !tests/**
                  !examples/**
                  !deployment-pattern.yml

              # Checkout release-engine-core         
              - checkout: release-engine-core # release-engine-core repository
                path: s/checkoutDirectory/release-engine-core
                sparseCheckoutPatterns: |
                  **/common/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep              

          # Scenario 4: Production pipeline consuming a pattern from release-engine-core repository (internal pattern)
          - ${{ if eq(parameters.patternSettings.isExternalPattern, 'false') }}:
              - powershell: |
                  Write-Host "Deployment Pipeline: Release Engine Pattern - #4"
                displayName: 'Deployment Pipeline: Release Engine Pattern - #4'

              # Checkout configuration files from self (configuration repository)
              - checkout: self # configuration repository
                path: s/checkoutDirectory/configuration
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.jsonc
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**

              # Checkout release-engine-core repository
              - checkout: release-engine-core
                path: s/checkoutDirectory/release-engine-core
                sparseCheckoutPatterns: |
                  **/common/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
                  
          # TODO: Move scripts to a PowerShell Module, so they are not required to be copied 
          # Copy common scripts from release-engine-core                  
          - task: CopyFiles@2
            displayName: Copying common scripts content (external)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/s/checkoutDirectory/release-engine-core/common/scripts
              Contents: |
                **/*.ps1
                **/*.sh
              TargetFolder: $(build.artifactstagingdirectory)/common/scripts
              flattenFolders: false

      # Debug step to show settings and environment variables
      # Only runs if System.Debug is set to true
      - powershell: |
          # Shows all configurations for debugging purposes of patternSettings          
          Write-Host "\nParameters:"
          Write-Host '${{ convertToJson(parameters) }}'
          Write-Host "\nVariables:"
          Get-ChildItem env:

          tree /F $(Pipeline.Workspace) 

          Get-ChildItem $(Pipeline.Workspace) -recurse
        displayName: Debug - Display Settings and Environment Variables
        condition: eq( variables['System.Debug'], 'true' )

      # Gathers files from the configuration repository
      - task: CopyFiles@2
        displayName: Copying Configuration artifacts
        inputs:
          SourceFolder: $(Pipeline.Workspace)/s/checkoutDirectory
          Contents: |
            **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
            **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.jsonc
            **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
          TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/configuration
          flattenFolders: true

      # Gathers IaC files from the pattern repository
      - task: CopyFiles@2
        displayName: Copying IaC artifacts
        inputs:
          SourceFolder: $(Pipeline.Workspace)/s/checkoutDirectory
          Contents: |
            **${{ parameters.patternSettings.patternArtifactsPath }}**/*.bicep
            !tests/**
            !examples/**
            !deployment-pattern.yml
          TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/iac
          flattenFolders: true             
      
      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/$(deploymentPattern)
          artifact: $(deploymentPattern)
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/common
          artifact: common
          publishLocation: pipeline