parameters:
  - name: deploymentSettings
    type: object
  - name: patternSettings
    type: object

jobs:
  - job: ${{ variables.deploymentPattern }}_build
    displayName: Building IaC Artifacts
    variables:
      - template: ${{ parameters.deploymentSettings.configurationFilePath }}/metadata.yml@self
    steps:

      # For test pipelines inside release-engine-core repo (single repository)
      - ${{ if eq(parameters.deploymentSettings.isTestPipeline, 'true') }}: # 1
          
          - ${{ if eq(parameters.patternSettings.isExternalPattern, 'true') }}: # 2
              - checkout: self # pattern repository
                path: checkoutDirectory
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
                  **/common/scripts/**

              # Checkout release-engine-core         
              - checkout: release-engine-core
                path: checkoutDirectory/release-engine-core
                sparseCheckoutPatterns: |
                  **/common/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep

          - ${{ if eq(parameters.patternSettings.isExternalPattern, 'false') }}: # 3
              - checkout: self # release-engine-core repository
                path: checkoutDirectory
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
                  **/common/scripts/**

      # Production / else
      - ${{ if eq(parameters.deploymentSettings.isTestPipeline, 'false') }}: # 4

          # For production pipelines or external patterns
          - ${{ if ne(parameters.patternSettings.isExternalPattern, 'true') }}: # 5
              
              # Checkout configuration files from self (configuration repository)
              - checkout: self # configuration repository
                path: checkoutDirectory/configuration
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**

              # Checkout pattern from dedicated pattern repository
              - checkout: pattern # pattern repository
                path: checkoutDirectory/pattern
                sparseCheckoutPatterns: |
                  **/*.bicep
                  !tests/**
                  !examples/**
                  !deployment-pattern.yml

              # Checkout release-engine-core         
              - checkout: release-engine-core # release-engine-core repository
                path: checkoutDirectory/release-engine-core
                sparseCheckoutPatterns: |
                  **/common/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
              
          # For production pipelines or external patterns
          - ${{ if ne(parameters.patternSettings.isExternalPattern, 'false') }}: # 6

              # Checkout configuration files from self (configuration repository)
              - checkout: self # configuration repository
                path: checkoutDirectory/configuration
                sparseCheckoutPatterns: |
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
                  **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**

              # Checkout release-engine-core         
              - checkout: release-engine-core # release-engine-core repository
                path: checkoutDirectory/release-engine-core
                sparseCheckoutPatterns: |
                  **/common/scripts/**
                  **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep

      - powershell: |
          # Shows all configurations for debugging purposes of patternSettings          
          Write-Host "\nParameters:"
          Write-Host '${{ convertToJson(parameters) }}'
          Write-Host "\nVariables:"
          Get-ChildItem env:

          tree /F $(Pipeline.Workspace)
        displayName: Debug - Display Settings and Environment Variables
        condition: eq( variables['System.Debug'], 'true' )

      # Copy configuration files - handle internal vs external context
      - ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          - task: CopyFiles@2
            displayName: Copying content from Configuration repository (internal)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/${{ parameters.deploymentSettings.configurationFilePath }}
              Contents: |
                **/*.json
                **/*.bicepparam
              TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/configuration
              flattenFolders: false

      - ${{ if ne(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          - task: CopyFiles@2
            displayName: Copying content from Configuration repository (external)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/configuration/${{ parameters.deploymentSettings.configurationFilePath }}
              Contents: |
                **/*.json
                **/*.bicepparam
              TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/configuration
              flattenFolders: false

      # ORIGINAL COPY TASKS LOGIC (REFERENCE ONLY - DO NOT UNCOMMENT)
      # - task: CopyFiles@2
      #   displayName: Copying content from Configuration repository
      #   inputs:
      #     SourceFolder: $(Pipeline.Workspace)/patternCheckoutDirectory/${{ parameters.deploymentSettings.configurationFilePath }}
      #     Contents: |
      #       **/*.json
      #       **/*.bicepparam
      #     TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/configuration
      #     flattenFolders: false

      # - task: CopyFiles@2
      #   displayName: Copying Deployment Pattern content
      #   inputs:
      #     SourceFolder: $(Pipeline.Workspace)/patternCheckoutDirectory
      #     Contents: |
      #       **/*.bicep
      #       !tests/**
      #       !examples/**
      #       !deployment-pattern.yml
      #     TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/iac
      #     flattenFolders: false

      # Copy pattern bicep files - handle internal vs external patterns
      - ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          - task: CopyFiles@2
            displayName: Copying Deployment Pattern content (internal)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/${{ parameters.patternSettings.patternArtifactsPath }}
              Contents: |
                **/*.bicep
                !tests/**
                !examples/**
                !deployment-pattern.yml
              TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/iac
              flattenFolders: false

      # When configurationPipelineContext is external but patternContext is internal (pattern from release-engine-core)
      - ${{ if and(ne(parameters.patternSettings.configurationPipelineContext, 'internal'), eq(parameters.patternSettings.patternContext, 'internal')) }}:
          - task: CopyFiles@2
            displayName: Copying Deployment Pattern content (external config, internal pattern)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/release-engine-core/${{ parameters.patternSettings.patternArtifactsPath }}
              Contents: |
                **/*.bicep
                !tests/**
                !examples/**
                !deployment-pattern.yml
              TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/iac
              flattenFolders: false

      # When both configurationPipelineContext and patternContext are external
      - ${{ if and(ne(parameters.patternSettings.configurationPipelineContext, 'internal'), eq(parameters.patternSettings.patternContext, 'external')) }}:
          - task: CopyFiles@2
            displayName: Copying Deployment Pattern content (external pattern)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/pattern
              Contents: |
                **/*.bicep
                !tests/**
                !examples/**
                !deployment-pattern.yml
              TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/iac
              flattenFolders: false

      # Copy common scripts - handle internal vs external context
      - ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          - task: CopyFiles@2
            displayName: Copying common scripts content (internal)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/common/scripts/
              Contents: |
                **/*.ps1
                **/*.sh
              TargetFolder: $(build.artifactstagingdirectory)/common/scripts
              flattenFolders: false

      - ${{ if ne(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          - task: CopyFiles@2
            displayName: Copying common scripts content (external)
            inputs:
              SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/release-engine-core/common/scripts/
              Contents: |
                **/*.ps1
                **/*.sh
              TargetFolder: $(build.artifactstagingdirectory)/common/scripts
              flattenFolders: false
      
      # - task: CopyFiles@2
      #   displayName: Copying scripts content (flattened)
      #   inputs:
      #     SourceFolder: $(Pipeline.Workspace)/patternCheckoutDirectory/${{ parameters.deploymentSettings.configurationFilePath }}
      #     Contents: |
      #       **/scripts/**/*.ps1
      #       **/scripts/**/*.sh
      #     TargetFolder: $(build.artifactstagingdirectory)/$(deploymentPattern)/scripts
      #     flattenFolders: true

      # - task: PublishPipelineArtifact@1
      #   inputs:
      #     targetPath: $(Pipeline.Workspace)/scriptsCheckoutDirectory
      #     artifact: common
      #     publishLocation: pipeline

      # - task: PublishPipelineArtifact@1
      #   inputs:
      #     targetPath: $(Pipeline.Workspace)/checkoutDirectory
      #     artifact: $(deploymentPattern)
      #     publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/$(deploymentPattern)
          artifact: $(deploymentPattern)
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(build.artifactstagingdirectory)/common
          artifact: common
          publishLocation: pipeline