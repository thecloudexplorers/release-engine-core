      #       value: configurationCheckoutDirectory
          

      # - ${{ else }}:
      #     - template: ${{ parameters.patternSettings.configurationFilePath }}/metadata.yml@self
      #     - name: releaseEngineCheckoutDirectory
      #       value: releaseEngineCheckoutDirectory

      - template: ${{ parameters.deploymentSettings.configurationFilePath }}/metadata.yml@self


    steps:

      # Checkout configuration files

      # The configuration repository always initiate the pipeline, 
      # its default alias is self
      - checkout: self
        # path: configurationCheckoutDirectory
        path: checkoutDirectory/configuration
        sparseCheckoutPatterns: |
          *.bicepparam
          *.json
          **/scripts/**
 
      # It is a production pipeline (not a test pipeline)
      - ${{ if eq(parameters.deploymentSettings.isTestPipeline,'false') }}:

          # If it is a production pipeline, the release engine will always be in a different repo than the configuration
          - checkout: release-engine-core
            path: checkoutDirectory/common
            sparseCheckoutPatterns: |
              **
              !tests/**
              !examples/**
              !pipelines/**

        # Pattern is external from release-engine-core
          - ${{ if eq(parameters.patternSettings.isExternalPattern,'true') }}:
              
              # Checkout the pattern from independent repository
              - checkout: pattern
                path: checkoutDirectory/iac
                sparseCheckoutPatterns: |
                  *.bicep
                  # !tests/**
                  # !examples/**
                  # !deployment-pattern.yml

        # Pattern is internal from release-engine-core

          # Pattern is external from release-engine-core
          - ${{ if eq(parameters.patternSettings.isExternalPattern,'false') }}:

              # Checkout the pattern from release-engine-core repository
              - checkout: self
                path: checkoutDirectory/iac
                sparseCheckoutPatterns: |
                  *.bicep
                  # !tests/**
                  # !examples/**
                  # !deployment-pattern.yml

      # It is a test pipeline (not production)
      - ${{ if eq(parameters.deploymentSettings.isTestPipeline,'true') }}:

          # Pattern is ## external ## from release-engine-core, so the configuration test is in the pattern repository 
          - ${{ if eq(parameters.patternSettings.isExternalPattern,'true') }}:
              
              # Checkout the pattern from configuration repository #TODO: Check if can be moved outside the if
              - checkout: self
                path: checkoutDirectory/iac
                sparseCheckoutPatterns: |
                  *.bicep
                  # !tests/**
                  # !examples/**
                  # !deployment-pattern.yml

              # If the pattern is external, the release engine is in a different repo than the configuration
              - checkout: release-engine-core
                path: checkoutDirectory/common
                sparseCheckoutPatterns: |
                  **
                  !tests/**
                  !examples/**
                  !pipelines/**

          # Pattern is ## not external ##, it is built-in in the release-engine-core, so the release-engine-core is in also in the configuration test repository 
          - ${{ if eq(parameters.patternSettings.isExternalPattern,'false') }}:
              
              # Checkout the pattern from configuration repository #TODO: Check if can be moved outside the if
              - checkout: self
                path: checkoutDirectory/iac
                sparseCheckoutPatterns: |
                  *.bicep
                  # !tests/**
                  # !examples/**
                  # !deployment-pattern.yml

              # If the pattern is external, the release engine is in a different repo than the configuration
              - checkout: self
                path: checkoutDirectory/common
                sparseCheckoutPatterns: |
                  **
                  !tests/**
                  !examples/**
                  !pipelines/**                  

      - powershell: |
          # Shows all configurations for debugging purposes of patternSettings          
          Write-Host "\nParameters:"
          Write-Host '${{ convertToJson(parameters) }}'
          Write-Host "\nVariables:"
          Get-ChildItem env:

          tree /F $(Pipeline.Workspace)
        displayName: Debug - Display Settings and Environment Variables
        condition: eq( variables['System.Debug'], 'true' )

      - task: CopyFiles@2
        displayName: Copying common content
        inputs:
          SourceFolder: $(Pipeline.Workspace)/checkoutDirectory/common
          Contents: |
            **
            !tests/**
            !examples/**
            !pipelines/**
          TargetFolder: $(build.artifactstagingdirectory)/common
          flattenFolders: false

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(Pipeline.Workspace)/checkoutDirectory/common
          artifact: common
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: $(Pipeline.Workspace)/checkoutDirectory
          artifact: $(deploymentPattern)
          publishLocation: pipeline