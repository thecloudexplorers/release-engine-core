parameters:
  - name: deploymentSettings
    type: object
  - name: patternSettings
    type: object

jobs:
  - job: ${{ variables.deploymentPattern }}_build
    displayName: Building IaC Artifacts
    variables:
      - template: ${{ parameters.deploymentSettings.configurationFilePath }}/metadata.yml@self
      
      # Standardized workspace paths (always the same regardless of context)
      - name: configurationPath
        value: $(Pipeline.Workspace)/configuration
      - name: patternPath
        value: $(Pipeline.Workspace)/pattern
      - name: commonPath
        value: $(Pipeline.Workspace)/common
      
      # Determine if we're in internal context (testing in core repo)
      - name: isInternalContext
        value: ${{ eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}
      
      # Determine if pattern is external
      - name: isExternalPattern
        value: ${{ eq(parameters.patternSettings.patternContext, 'external') }}
    
    steps:
      # =============================================================================
      # CHECKOUT PHASE - Always checkout to standardized paths
      # =============================================================================

      # Internal Context: Everything from self repository
      - ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          - checkout: self
            displayName: 'Checkout: All resources (internal context)'
            path: s
            sparseCheckoutPatterns: |
              **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
              **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
              **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**
              **${{ parameters.patternSettings.patternArtifactsPath }}/**/*.bicep
              **/common/scripts/**

      # External Context: Checkout from multiple repositories
      - ${{ if ne(parameters.patternSettings.configurationPipelineContext, 'internal') }}:
          
          # Always checkout configuration from self
          - checkout: self
            displayName: 'Checkout: Configuration files'
            path: configuration
            sparseCheckoutPatterns: |
              **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.json
              **${{ parameters.deploymentSettings.configurationFilePath }}/**/*.bicepparam
              **${{ parameters.deploymentSettings.configurationFilePath }}/**/scripts/**

          # Always checkout common scripts from release-engine-core
          - checkout: release-engine-core
            displayName: 'Checkout: Common scripts'
            path: common
            sparseCheckoutPatterns: |
              **/common/scripts/**

          # Checkout external pattern repository if needed
          - ${{ if eq(parameters.patternSettings.patternContext, 'external') }}:
              - checkout: pattern
                displayName: 'Checkout: External pattern'
                path: pattern
                sparseCheckoutPatterns: |
                  **/*.bicep
                  !tests/**
                  !examples/**
                  !deployment-pattern.yml

      # =============================================================================
      # DEBUG PHASE
      # =============================================================================
      
      - powershell: |
          Write-Host "`n=========================================="
          Write-Host "PIPELINE CONFIGURATION"
          Write-Host "=========================================="
          Write-Host "Context: $(isInternalContext)"
          Write-Host "External Pattern: $(isExternalPattern)"
          Write-Host "`nParameters:"
          Write-Host '${{ convertToJson(parameters) }}'
          Write-Host "`nStandardized Paths:"
          Write-Host "Configuration: $(configurationPath)"
          Write-Host "Pattern: $(patternPath)"
          Write-Host "Common: $(commonPath)"
          Write-Host "`nAll Variables:"
          Get-ChildItem env: | Sort-Object Name
          Write-Host "`nWorkspace Structure:"
          tree /F $(Pipeline.Workspace)
        displayName: Debug - Display Settings and Environment Variables
        condition: eq( variables['System.Debug'], 'true' )

      # =============================================================================
      # COPY PHASE - Unified copy tasks using standardized paths
      # =============================================================================
      
      # Copy configuration files
      - task: CopyFiles@2
        displayName: 'Copy: Configuration files'
        inputs:
          SourceFolder: ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}$(Pipeline.Workspace)/s${{ parameters.deploymentSettings.configurationFilePath }}${{ else }}$(configurationPath)${{ parameters.deploymentSettings.configurationFilePath }}
          Contents: |
            **/*.json
            **/*.bicepparam
          TargetFolder: $(Build.ArtifactStagingDirectory)/$(deploymentPattern)/configuration
          flattenFolders: false

      # Copy pattern bicep files
      - task: CopyFiles@2
        displayName: 'Copy: Pattern bicep files'
        inputs:
          SourceFolder: ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}$(Pipeline.Workspace)/s${{ parameters.patternSettings.patternArtifactsPath }}${{ elseif eq(parameters.patternSettings.patternContext, 'external') }}$(patternPath)${{ else }}$(commonPath)${{ parameters.patternSettings.patternArtifactsPath }}
          Contents: |
            **/*.bicep
            !tests/**
            !examples/**
            !deployment-pattern.yml
          TargetFolder: $(Build.ArtifactStagingDirectory)/$(deploymentPattern)/iac
          flattenFolders: false

      # Copy common scripts
      - task: CopyFiles@2
        displayName: 'Copy: Common scripts'
        inputs:
          SourceFolder: ${{ if eq(parameters.patternSettings.configurationPipelineContext, 'internal') }}$(Pipeline.Workspace)/s/common/scripts${{ else }}$(commonPath)/common/scripts
          Contents: |
            **/*.ps1
            **/*.sh
          TargetFolder: $(Build.ArtifactStagingDirectory)/common/scripts
          flattenFolders: false

      # =============================================================================
      # PUBLISH PHASE
      # =============================================================================
      
      - task: PublishPipelineArtifact@1
        displayName: 'Publish: Pattern artifacts'
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/$(deploymentPattern)
          artifact: $(deploymentPattern)
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        displayName: 'Publish: Common artifacts'
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/common
          artifact: common
          publishLocation: pipeline